<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIW KIW - Chat App</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --pink:#ff4f91;
    --pink2:#ff8db7;
    --purple:#8d5cff;
    --dark:#120b18;
    --dark2:#1b1023;
    --card:rgba(25,15,31,.92);
    --text:#fff;
    --muted:#b9aabd;
    --border:rgba(255,255,255,.12);
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    color:var(--text);
    overflow-x:hidden;

    background:
        linear-gradient(
            135deg,
            rgba(18,8,23,.55),
            rgba(76,18,57,.55)
        ),
        url("https://i.ibb.co/HLcCG6L7/image.png");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

/* animated background */
body::before{
    content:"";
    position:fixed;
    inset:-100px;
    z-index:-1;

    background:
        radial-gradient(circle at 20% 20%,rgba(255,78,145,.25),transparent 25%),
        radial-gradient(circle at 80% 70%,rgba(141,92,255,.25),transparent 25%);

    animation:bgMove 8s ease-in-out infinite alternate;
}

@keyframes bgMove{
    from{
        transform:scale(1) translate(0,0);
    }
    to{
        transform:scale(1.12) translate(25px,-20px);
    }
}

/* ================= LOGIN ================= */

.auth-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-box{
    width:100%;
    max-width:420px;
    padding:30px;

    background:rgba(16,9,22,.91);
    border:1px solid rgba(255,100,160,.28);
    border-radius:25px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        0 0 50px rgba(255,70,140,.08);

    backdrop-filter:blur(15px);
}

.brand{
    text-align:center;
    margin-bottom:25px;
}

.brand h1{
    font-size:38px;
    font-weight:900;

    background:linear-gradient(
        90deg,
        #ff77aa,
        #fff,
        #b894ff
    );

    -webkit-background-clip:text;
    color:transparent;
}

.brand p{
    color:var(--muted);
    font-size:12px;
    margin-top:6px;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    margin-bottom:20px;
    background:#0d0812;
    padding:4px;
    border-radius:12px;
}

.tabs button{
    border:0;
    background:transparent;
    color:#95899b;
    padding:12px;
    cursor:pointer;
    border-radius:9px;
    font-weight:bold;
}

.tabs button.active{
    color:#fff;
    background:linear-gradient(135deg,var(--pink),var(--purple));
}

.form{
    display:none;
}

.form.active{
    display:block;
}

.input-group{
    margin-bottom:14px;
}

.input-group label{
    display:block;
    color:#cfc1d3;
    font-size:11px;
    margin-bottom:6px;
}

.input-group input{
    width:100%;
    padding:13px 14px;

    border:1px solid var(--border);
    border-radius:11px;

    background:#0c0810;
    color:white;
    outline:none;

    font-size:13px;
}

.input-group input:focus{
    border-color:var(--pink);
    box-shadow:0 0 0 3px rgba(255,79,145,.08);
}

.main-btn{
    width:100%;
    border:0;
    padding:14px;
    border-radius:12px;

    color:#fff;
    font-weight:800;
    cursor:pointer;

    background:linear-gradient(
        135deg,
        var(--pink),
        var(--purple)
    );

    transition:.25s;
}

.main-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(255,65,140,.25);
}

.note{
    margin-top:14px;
    color:#887b8e;
    font-size:10px;
    text-align:center;
    line-height:1.6;
}

/* ================= APP ================= */

.app{
    display:none;
    height:100vh;
}

.app.active{
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:330px;
    background:rgba(13,8,17,.94);
    border-right:1px solid var(--border);

    display:flex;
    flex-direction:column;

    backdrop-filter:blur(15px);
}

.app-header{
    padding:18px;
    border-bottom:1px solid var(--border);
}

.app-logo{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.app-logo strong{
    font-size:22px;

    background:linear-gradient(
        90deg,
        #ff6fa4,
        #b692ff
    );

    -webkit-background-clip:text;
    color:transparent;
}

.logout{
    border:1px solid rgba(255,255,255,.12);
    background:#170d1d;
    color:#aaa;
    padding:7px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:10px;
}

/* PROFILE */

.profile{
    padding:15px 18px;
    display:flex;
    align-items:center;
    gap:11px;
}

.avatar{
    width:43px;
    height:43px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg,var(--pink),var(--purple));
    font-weight:900;
}

.profile-name{
    font-size:13px;
    font-weight:bold;
}

.profile-number{
    color:#887c8e;
    font-size:10px;
    margin-top:3px;
}

/* ADD CONTACT */

.add-contact{
    padding:0 15px 15px;
}

.add-row{
    display:flex;
    gap:7px;
}

.add-row input{
    flex:1;
    min-width:0;

    padding:11px;
    border-radius:10px;

    background:#0b0710;
    color:white;

    border:1px solid var(--border);
    outline:none;
}

.add-row button{
    width:45px;
    border:0;
    border-radius:10px;

    color:#fff;
    background:linear-gradient(
        135deg,
        var(--pink),
        var(--purple)
    );

    cursor:pointer;
}

/* CONTACT */

.contact-title{
    padding:5px 18px 10px;
    color:#807384;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.contacts{
    overflow-y:auto;
    flex:1;
}

.contact{
    padding:13px 18px;
    display:flex;
    gap:11px;
    align-items:center;
    cursor:pointer;
    border-left:3px solid transparent;
    transition:.2s;
}

.contact:hover,
.contact.active{
    background:rgba(255,79,145,.08);
    border-left-color:var(--pink);
}

.contact-info{
    min-width:0;
    flex:1;
}

.contact-name{
    font-size:12px;
    font-weight:bold;
}

.contact-preview{
    margin-top:4px;
    color:#83778a;
    font-size:10px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ================= CHAT ================= */

.chat{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;

    background:rgba(8,5,11,.68);
}

.chat-header{
    height:73px;
    padding:12px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid var(--border);

    background:rgba(15,8,20,.75);
    backdrop-filter:blur(12px);
}

.chat-user{
    display:flex;
    align-items:center;
    gap:10px;
}

.chat-user-name{
    font-weight:bold;
    font-size:13px;
}

.online{
    color:#56e59a;
    font-size:9px;
    margin-top:3px;
}

.call-buttons{
    display:flex;
    gap:7px;
}

.call-buttons button{
    width:36px;
    height:36px;

    border:1px solid var(--border);
    border-radius:10px;

    background:#160d1c;
    color:white;
    cursor:pointer;
}

.call-buttons button:hover{
    background:var(--pink);
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:25px;

    display:flex;
    flex-direction:column;
    gap:9px;
}

.empty-chat{
    margin:auto;
    text-align:center;
    color:#776a7d;
}

.empty-chat div{
    font-size:45px;
    margin-bottom:10px;
}

.empty-chat p{
    font-size:11px;
}

/* BUBBLE */

.message{
    max-width:70%;
    padding:10px 13px;
    border-radius:14px;

    font-size:12px;
    line-height:1.5;

    word-break:break-word;
}

.message.me{
    align-self:flex-end;

    background:linear-gradient(
        135deg,
        #e53f7f,
        #754bd0
    );

    border-bottom-right-radius:4px;
}

.message.other{
    align-self:flex-start;

    background:#211728;
    border:1px solid rgba(255,255,255,.07);

    border-bottom-left-radius:4px;
}

.message-time{
    display:block;
    text-align:right;
    font-size:8px;
    opacity:.6;
    margin-top:4px;
}

/* INPUT */

.chat-input{
    padding:13px 17px;

    border-top:1px solid var(--border);

    background:rgba(13,7,17,.92);
}

.send-row{
    display:flex;
    gap:8px;
}

.send-row input{
    flex:1;
    padding:12px 14px;

    background:#0a0610;
    color:white;

    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
}

.send-row button{
    width:45px;
    border:0;
    border-radius:12px;

    color:white;

    background:linear-gradient(
        135deg,
        var(--pink),
        var(--purple)
    );

    cursor:pointer;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.7);

    display:none;
    align-items:center;
    justify-content:center;

    z-index:500;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:90%;
    max-width:350px;

    background:#160d1d;
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;

    padding:25px;
    text-align:center;
}

.modal-box h3{
    margin-bottom:8px;
}

.modal-box p{
    color:#9e90a3;
    font-size:11px;
    line-height:1.6;
}

.modal-box button{
    margin-top:18px;
    padding:10px 25px;
    border:0;
    border-radius:9px;
    background:var(--pink);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

/* ================= MOBILE ================= */

.mobile-menu{
    display:none;
}

@media(max-width:700px){

    .app{
        height:100dvh;
    }

    .sidebar{
        width:100%;
    }

    .chat{
        display:none;
    }

    .app.mobile-chat .sidebar{
        display:none;
    }

    .app.mobile-chat .chat{
        display:flex;
    }

    .mobile-menu{
        display:block;
        border:0;
        background:none;
        color:#fff;
        font-size:20px;
        cursor:pointer;
        margin-right:8px;
    }

    .message{
        max-width:82%;
    }

    .auth-box{
        padding:23px;
    }
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<div class="auth-page" id="authPage">

    <div class="auth-box">

        <div class="brand">
            <h1>KIW KIW</h1>
            <p>Chat sederhana untuk terhubung dengan teman</p>
        </div>

        <div class="tabs">

            <button
                id="loginTab"
                class="active"
                onclick="switchAuth('login')">
                LOGIN
            </button>

            <button
                id="registerTab"
                onclick="switchAuth('register')">
                DAFTAR
            </button>

        </div>


        <!-- LOGIN -->

        <form
            class="form active"
            id="loginForm"
            onsubmit="login(event)">

            <div class="input-group">

                <label>Nomor Telepon</label>

                <input
                    id="loginPhone"
                    type="tel"
                    placeholder="Contoh: 08123456789"
                    required>

            </div>


            <div class="input-group">

                <label>Sandi Angka</label>

                <input
                    id="loginPin"
                    type="password"
                    inputmode="numeric"
                    maxlength="12"
                    placeholder="Masukkan sandi"
                    required>

            </div>


            <button class="main-btn">
                MASUK KE KIW KIW
            </button>

        </form>


        <!-- REGISTER -->

        <form
            class="form"
            id="registerForm"
            onsubmit="register(event)">

            <div class="input-group">

                <label>Nama / Username</label>

                <input
                    id="regName"
                    type="text"
                    maxlength="30"
                    placeholder="Nama kamu"
                    required>

            </div>


            <div class="input-group">

                <label>Nomor Telepon</label>

                <input
                    id="regPhone"
                    type="tel"
                    maxlength="20"
                    placeholder="Contoh: 08123456789"
                    required>

            </div>


            <div class="input-group">

                <label>Sandi Aplikasi - Angka Saja</label>

                <input
                    id="regPin"
                    type="password"
                    inputmode="numeric"
                    maxlength="12"
                    placeholder="Minimal 4 angka"
                    required>

            </div>


            <button class="main-btn">
                BUAT AKUN
            </button>

        </form>


        <div class="note">
            Versi demo. Data akun disimpan secara lokal
            pada browser ini.
        </div>

    </div>

</div>


<!-- ================= APPLICATION ================= -->

<div class="app" id="app">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="app-header">

            <div class="app-logo">

                <strong>KIW KIW</strong>

                <button
                    class="logout"
                    onclick="logout()">
                    Keluar
                </button>

            </div>

        </div>


        <div class="profile">

            <div
                class="avatar"
                id="myAvatar">
                K
            </div>

            <div>

                <div
                    class="profile-name"
                    id="myName">
                    User
                </div>

                <div
                    class="profile-number"
                    id="myPhone">
                    -
                </div>

            </div>

        </div>


        <!-- ADD -->

        <div class="add-contact">

            <div class="add-row">

                <input
                    id="addPhone"
                    type="tel"
                    placeholder="Nomor telepon teman">

                <button
                    onclick="addContact()">
                    +
                </button>

            </div>

        </div>


        <div class="contact-title">
            Kontak
        </div>


        <div
            class="contacts"
            id="contacts">
        </div>

    </aside>


    <!-- CHAT -->

    <main class="chat">

        <header class="chat-header">

            <div class="chat-user">

                <button
                    class="mobile-menu"
                    onclick="backToContacts()">
                    ‹
                </button>

                <div
                    class="avatar"
                    id="chatAvatar">
                    ?
                </div>

                <div>

                    <div
                        class="chat-user-name"
                        id="chatName">
                        Pilih kontak
                    </div>

                    <div class="online">
                        ● Demo chat
                    </div>

                </div>

            </div>


            <div class="call-buttons">

                <button onclick="showCall('Panggilan suara')">
                    ☎
                </button>

                <button onclick="showCall('Panggilan video')">
                    ▣
                </button>

            </div>

        </header>


        <div
            class="messages"
            id="messages">

            <div class="empty-chat">

                <div>💬</div>

                <p>
                    Pilih kontak untuk mulai chat
                </p>

            </div>

        </div>


        <div class="chat-input">

            <div class="send-row">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Tulis pesan..."
                    onkeydown="handleEnter(event)">

                <button
                    onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<!-- MODAL -->

<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <h3 id="modalTitle">
            KIW KIW
        </h3>

        <p id="modalText">
            Demo
        </p>

        <button onclick="closeModal()">
            TUTUP
        </button>

    </div>

</div>


<script>

/* ==========================================
   STORAGE
========================================== */

const USERS_KEY = "kiwkiw_users";
const CURRENT_KEY = "kiwkiw_current";
const CONTACT_KEY = "kiwkiw_contacts";
const CHAT_KEY = "kiwkiw_chats";

let users = JSON.parse(
    localStorage.getItem(USERS_KEY) || "[]"
);

let contacts = JSON.parse(
    localStorage.getItem(CONTACT_KEY) || "[]"
);

let chats = JSON.parse(
    localStorage.getItem(CHAT_KEY) || "{}"
);

let currentUser = null;
let selectedContact = null;


/* ==========================================
   HELPERS
========================================== */

function saveAll(){

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

    localStorage.setItem(
        CONTACT_KEY,
        JSON.stringify(contacts)
    );

    localStorage.setItem(
        CHAT_KEY,
        JSON.stringify(chats)
    );

}


function cleanPhone(phone){

    return phone
        .replace(/\D/g,"")
        .trim();

}


function getInitial(name){

    return (name || "K")
        .charAt(0)
        .toUpperCase();

}


/* ==========================================
   AUTH TABS
========================================== */

function switchAuth(type){

    document
        .getElementById("loginTab")
        .classList.toggle(
            "active",
            type === "login"
        );

    document
        .getElementById("registerTab")
        .classList.toggle(
            "active",
            type === "register"
        );

    document
        .getElementById("loginForm")
        .classList.toggle(
            "active",
            type === "login"
        );

    document
        .getElementById("registerForm")
        .classList.toggle(
            "active",
            type === "register"
        );

}


/* ==========================================
   REGISTER
========================================== */

function register(event){

    event.preventDefault();

    const name =
        document
        .getElementById("regName")
        .value
        .trim();

    const phone =
        cleanPhone(
            document
            .getElementById("regPhone")
            .value
        );

    const pin =
        document
        .getElementById("regPin")
        .value
        .trim();


    if(!/^\d+$/.test(pin)){

        showModal(
            "Sandi tidak valid",
            "Sandi aplikasi hanya boleh menggunakan angka."
        );

        return;
    }


    if(pin.length < 4){

        showModal(
            "Sandi terlalu pendek",
            "Gunakan minimal 4 angka."
        );

        return;
    }


    if(!name || !phone){

        showModal(
            "Data belum lengkap",
            "Isi semua data terlebih dahulu."
        );

        return;
    }


    if(users.some(u => u.phone === phone)){

        showModal(
            "Nomor sudah terdaftar",
            "Silakan gunakan nomor lain atau login."
        );

        return;
    }


    const user = {
        id:Date.now().toString(),
        name:name,
        phone:phone,
        pin:pin
    };


    users.push(user);

    currentUser = user;

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

    localStorage.setItem(
        CURRENT_KEY,
        user.id
    );

    openApp();

}


/* ==========================================
   LOGIN
========================================== */

function login(event){

    event.preventDefault();

    const phone =
        cleanPhone(
            document
            .getElementById("loginPhone")
            .value
        );

    const pin =
        document
        .getElementById("loginPin")
        .value
        .trim();


    const user = users.find(
        u =>
            u.phone === phone &&
            u.pin === pin
    );


    if(!user){

        showModal(
            "Login gagal",
            "Nomor telepon atau sandi tidak cocok."
        );

        return;
    }


    currentUser = user;

    localStorage.setItem(
        CURRENT_KEY,
        user.id
    );

    openApp();

}


/* ==========================================
   OPEN APP
========================================== */

function openApp(){

    document
        .getElementById("authPage")
        .style.display = "none";

    document
        .getElementById("app")
        .classList.add("active");


    document
        .getElementById("myName")
        .textContent = currentUser.name;

    document
        .getElementById("myPhone")
        .textContent = "+" + currentUser.phone;

    document
        .getElementById("myAvatar")
        .textContent = getInitial(
            currentUser.name
        );


    loadContacts();

}


/* ==========================================
   ADD CONTACT
========================================== */

function addContact(){

    const phone =
        cleanPhone(
            document
            .getElementById("addPhone")
            .value
        );


    if(!phone){

        showModal(
            "Nomor belum diisi",
            "Masukkan nomor telepon teman."
        );

        return;
    }


    if(phone === currentUser.phone){

        showModal(
            "Tidak bisa",
            "Nomor sendiri tidak dapat ditambahkan."
        );

        return;
    }


    const user = users.find(
        u => u.phone === phone
    );


    if(!user){

        showModal(
            "Pengguna tidak ditemukan",
            "Nomor tersebut belum memiliki akun KIW KIW pada browser demo ini."
        );

        return;
    }


    if(
        contacts.some(
            c =>
                c.owner === currentUser.id &&
                c.phone === phone
        )
    ){

        showModal(
            "Sudah ada",
            "Kontak tersebut sudah ada."
        );

        return;
    }


    contacts.push({

        owner:currentUser.id,
        phone:user.phone,
        name:user.name

    });


    saveAll();

    document
        .getElementById("addPhone")
        .value = "";

    loadContacts();


    selectContact(user);

}


/* ==========================================
   LOAD CONTACTS
========================================== */

function loadContacts(){

    const box =
        document
        .getElementById("contacts");

    box.innerHTML = "";


    const myContacts =
        contacts.filter(
            c =>
                c.owner === currentUser.id
        );


    if(myContacts.length === 0){

        box.innerHTML = `
            <div style="
                padding:25px 18px;
                color:#716577;
                font-size:10px;
                line-height:1.7;
            ">
                Belum ada kontak.<br>
                Tambahkan nomor telepon pengguna KIW KIW di atas.
            </div>
        `;

        return;
    }


    myContacts.forEach(contact => {

        const div =
            document.createElement("div");

        div.className = "contact";

        div.innerHTML = `

            <div class="avatar"
                 style="width:38px;height:38px;font-size:12px">
                ${getInitial(contact.name)}
            </div>

            <div class="contact-info">

                <div class="contact-name">
                    ${escapeHTML(contact.name)}
                </div>

                <div class="contact-preview">
                    ${contact.phone}
                </div>

            </div>

        `;


        div.onclick = () => {

            const user =
                users.find(
                    u =>
                        u.phone === contact.phone
                );

            if(user){
                selectContact(user);
            }

        };


        box.appendChild(div);

    });

}


/* ==========================================
   SELECT CONTACT
========================================== */

function selectContact(user){

    selectedContact = user;


    document
        .getElementById("chatName")
        .textContent = user.name;

    document
        .getElementById("chatAvatar")
        .textContent = getInitial(
            user.name
        );


    document
        .getElementById("app")
        .classList.add("mobile-chat");


    loadMessages();

}


/* ==========================================
   CHAT KEY
========================================== */

function chatKey(){

    if(!currentUser || !selectedContact){
        return null;
    }

    const ids = [
        currentUser.id,
        selectedContact.id
    ].sort();

    return ids.join("_");

}


/* ==========================================
   SEND MESSAGE
========================================== */

function sendMessage(){

    if(!selectedContact){

        showModal(
            "Pilih kontak",
            "Pilih kontak terlebih dahulu."
        );

        return;
    }


    const input =
        document
        .getElementById("messageInput");

    const text =
        input.value.trim();


    if(!text){
        return;
    }


    const key = chatKey();


    if(!chats[key]){
        chats[key] = [];
    }


    chats[key].push({

        sender:currentUser.id,
        text:text,
        time:new Date().toLocaleTimeString(
            "id-ID",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )

    });


    saveAll();

    input.value = "";

    loadMessages();

}


/* ==========================================
   LOAD MESSAGES
========================================== */

function loadMessages(){

    const box =
        document
        .getElementById("messages");

    box.innerHTML = "";


    if(!selectedContact){

        box.innerHTML = `
            <div class="empty-chat">
                <div>💬</div>
                <p>Pilih kontak untuk mulai chat</p>
            </div>
        `;

        return;
    }


    const key = chatKey();

    const messages =
        chats[key] || [];


    if(messages.length === 0){

        box.innerHTML = `
            <div class="empty-chat">
                <div>💗</div>
                <p>Belum ada pesan. Mulai percakapan.</p>
            </div>
        `;

        return;
    }


    messages.forEach(message => {

        const div =
            document.createElement("div");

        div.className =
            "message " +
            (
                message.sender === currentUser.id
                    ? "me"
                    : "other"
            );


        div.innerHTML = `
            ${escapeHTML(message.text)}
            <span class="message-time">
                ${message.time}
            </span>
        `;


        box.appendChild(div);

    });


    box.scrollTop =
        box.scrollHeight;

}


/* ==========================================
   ENTER SEND
========================================== */

function handleEnter(event){

    if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

    }

}


/* ==========================================
   CALL UI
========================================== */

function showCall(type){

    if(!selectedContact){

        showModal(
            "Pilih kontak",
            "Pilih teman terlebih dahulu."
        );

        return;
    }


    showModal(
        type,
        "Fitur panggilan adalah tampilan demo. Panggilan antarperangkat memerlukan server/WebRTC."
    );

}


/* ==========================================
   BACK MOBILE
========================================== */

function backToContacts(){

    document
        .getElementById("app")
        .classList.remove("mobile-chat");

}


/* ==========================================
   LOGOUT
========================================== */

function logout(){

    localStorage.removeItem(
        CURRENT_KEY
    );

    currentUser = null;
    selectedContact = null;

    document
        .getElementById("app")
        .classList.remove("active");

    document
        .getElementById("authPage")
        .style.display = "flex";

    document
        .getElementById("loginForm")
        .reset();

}


/* ==========================================
   MODAL
========================================== */

function showModal(title,text){

    document
        .getElementById("modalTitle")
        .textContent = title;

    document
        .getElementById("modalText")
        .textContent = text;

    document
        .getElementById("modal")
        .classList.add("show");

}


function closeModal(){

    document
        .getElementById("modal")
        .classList.remove("show");

}


/* ==========================================
   SECURITY DISPLAY
========================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ==========================================
   AUTO LOGIN
========================================== */

window.addEventListener(
    "DOMContentLoaded",
    () => {

        const id =
            localStorage.getItem(
                CURRENT_KEY
            );


        if(id){

            const user =
                users.find(
                    u => u.id === id
                );

            if(user){

                currentUser = user;

                openApp();

            }

        }

    }
);

</script>
